services:
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env}:6379"
  redis-contracts:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${CONTRACT_REDIS_MAX_MEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    # Loopback only: available to a host-run development app, never to the public network.
    ports:
      - "127.0.0.1:${CONTRACT_REDIS_PORT:-56380}:6379"
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
